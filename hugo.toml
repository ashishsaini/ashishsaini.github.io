baseURL = "https://ashishsaini.work/"
languageCode = "en-us"
title = "Ashish Saini"
theme = "PaperMod"

enableRobotsTXT = true
enableEmoji = true

[params]
    author = "Ashish Saini"
    description = "Ashish Saini, independent CTO and AI product builder. I ship production-grade AI content systems and interactive learning products."
    keywords = ["Ashish Saini", "AI", "GenAI", "Agentic AI", "Computer Vision", "AR", "Virtual Try-On", "Serverless", "CTO", "Engineering Leadership"]
    DateFormat = "Jan 2, 2006"
    ShowReadingTime = true
    ShowShareButtons = false
    ShowBreadCrumbs = true
    ShowCodeCopyButtons = true
    ShowToc = true
    TocOpen = false
    ShowPostNavLinks = true
    defaultTheme = "auto"

    # Profile Mode
    [params.profileMode]
    enabled = true
    title = "Ashish Saini"
    subtitle = "Independent CTO and AI product builder. I help teams ship production-grade AI content systems and interactive learning products."
    imageUrl = "/img/profile.png"
    imageTitle = "Ashish Saini"
    imageWidth = 150
    imageHeight = 150

    [[params.profileMode.buttons]]
    name = "Discuss a Project"
    url = "/contact/"

    [[params.profileMode.buttons]]
    name = "See My Work"
    url = "/work/"

    # Social Icons
    [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/ashysaini"

    [[params.socialIcons]]
    name = "email"
    url = "mailto:ashy.saini@gmail.com"

[menu]
    [[menu.main]]
    name = "Home"
    url = "/"
    weight = 1

    [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 2

    [[menu.main]]
    name = "Expertise"
    url = "/expertise/"
    weight = 3

    [[menu.main]]
    name = "Work"
    url = "/work/"
    weight = 4

    [[menu.main]]
    name = "Writing"
    url = "/posts/"
    weight = 5

    [[menu.main]]
    name = "Contact"
    url = "/contact/"
    weight = 6

[outputs]
home = ["HTML", "RSS", "JSON"]

[taxonomies]
category = "categories"
tag = "tags"

[markup]
    [markup.highlight]
    noClasses = false
    style = "monokai"
    [markup.goldmark.renderer]
    unsafe = true
